<div class="modal fade" #modalEl tabindex="-1" aria-labelledby="seletorEmpresaTitulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="seletorEmpresaTitulo">Selecione a empresa</h5>
      </div>
      <div class="modal-body">
        <div role="radiogroup" aria-labelledby="seletorEmpresaTitulo" class="list-group">
          @for (e of empresa.empresas(); track e.id) {
            <label class="list-group-item list-group-item-action d-flex align-items-center gap-2">
              <input class="form-check-input mt-0" type="radio" name="empresa"
                     [value]="e.id" [checked]="escolhido() === e.id" (change)="escolhido.set(e.id)">
              <span>
                <span class="d-block fw-medium">{{ e.nomeFantasia || e.razaoSocial }}</span>
                <small class="text-muted">{{ e.razaoSocial }} · {{ formatarCnpj(e.cnpj) }}</small>
              </span>
            </label>
          }
        </div>
      </div>
      <div class="modal-footer">
        @if (empresa.id() !== null) {
          <button type="button" class="btn btn-outline-secondary" (click)="empresa.cancelarTroca()">Cancelar</button>
        }
        <button type="button" class="btn btn-primary" [disabled]="escolhido() === null" (click)="confirmar()">Continuar</button>
      </div>
    </div>
  </div>
</div>
