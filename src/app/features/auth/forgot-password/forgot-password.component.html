<div class="login-page d-flex align-items-center justify-content-center bg-body-tertiary">
  <button class="btn btn-sm btn-outline-secondary position-absolute top-0 end-0 m-3"
    (click)="theme.toggle()"
    [title]="theme.isDark() ? 'Mudar para tema claro' : 'Mudar para tema escuro'">
    @if (theme.isDark()) {
      <i class="bi bi-sun-fill"></i>
    } @else {
      <i class="bi bi-moon-stars-fill"></i>
    }
  </button>

  <div class="card shadow-sm login-card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="login-icon mb-3">
          <i class="bi bi-key-fill text-primary" style="font-size: 2.5rem;"></i>
        </div>
        <h5 class="fw-bold mb-0">Esqueci minha senha</h5>
        <p class="text-muted small">Informe seu email para receber as instruções de redefinição</p>
      </div>

      @if (success()) {
        <div class="alert alert-success text-center">
          <i class="bi bi-envelope-check-fill me-2"></i>
          <strong>Email enviado!</strong><br>
          <span class="small">Se este email estiver cadastrado, você receberá as instruções em breve.</span>
        </div>
        <a routerLink="/login" class="btn btn-outline-secondary w-100 mt-2">
          <i class="bi bi-arrow-left me-1"></i>Voltar ao login
        </a>
      } @else {
        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-4">
            <label class="form-label fw-medium">Email</label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="seu@email.com"
              [class.is-invalid]="field('email').invalid && field('email').touched"
            />
            <div class="invalid-feedback">Informe um email válido.</div>
          </div>

          @if (error()) {
            <div class="alert alert-danger py-2 small mb-3">
              <i class="bi bi-exclamation-triangle me-1"></i>{{ error() }}
            </div>
          }

          <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            Enviar instruções
          </button>

          <div class="text-center mt-3">
            <a routerLink="/login" class="text-muted small text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i>Voltar ao login
            </a>
          </div>
        </form>
      }
    </div>
  </div>
</div>
