<div>
  <div class="d-flex align-items-center gap-2 mb-4">
    <i class="bi bi-book fs-4 text-primary"></i>
    <h5 class="fw-bold mb-0">Manual do Usuário</h5>
  </div>

  @if (loading()) {
    <div class="text-center py-5 text-muted">
      <div class="spinner-border spinner-border-sm me-2"></div>Carregando manual...
    </div>
  } @else if (erro()) {
    <div class="alert alert-danger">
      <i class="bi bi-exclamation-triangle me-2"></i>Não foi possível carregar o manual.
    </div>
  } @else {
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-lg-5 manual-content" [innerHTML]="conteudo()"></div>
    </div>
  }
</div>
